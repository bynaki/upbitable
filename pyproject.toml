[project]
name = "upbitable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bynaki", email = "bynaki@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "trading-core @ git+https://github.com/bynaki/trading-core@main",
    "websockets>=15",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.18",
]
